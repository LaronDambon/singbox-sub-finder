# ============================================================================
# singbox-subs-finder — конфигурация
#
# Здесь лежат ОБЫЧНЫЕ настройки: то, что действует сейчас.
# Секретов нет — ключи и токены живут в .env, который в .gitignore.
#
# Приоритет слоёв, от сильного к слабому:
#   аргументы CLI > системное окружение > config.yaml
#   > значения по умолчанию из схемы.
#
# .env — НЕ слой настроек, а хранилище секретов: ключи и токены
# читаются только оттуда (см. группу secrets в схеме).
#
# Группа — это инструмент: настройки одного чекера лежат в
# singbox.checkers.<имя>, общее ядро проверки — в singbox.
# Список включённых чекеров — singbox.enabled_checkers.
# ============================================================================

# ----------------------------------------------------------------------------
# core
# ----------------------------------------------------------------------------
core:
  # Нижний порог stable: серверы ниже этого значения не импортируются в
  # проверку
  purge_stable_below: 0
  # stable нового сервера до первого удачного пинга: сколько неудач он
  # переживёт
  new_server_stable: 5
  # «Щит»: после удачного пинга stable поднимается не ниже этого значения
  shield_cycles: 96
  # Сколько лучших в каждой группе получают тег [<группа>-best]
  best_top: 4
  # Сколько следующих за лучшими получают тег [<группа>-reserve]
  best_reserve: 20

# ----------------------------------------------------------------------------
# singbox
# ----------------------------------------------------------------------------
singbox:
  # Какие проверяющие алгоритмы запускать и в каком порядке. Это список
  # включённых инструментов; настройки каждого — в singbox.checkers.<имя>
  # [url_probe, country, reachability, api_service, browser_service,
  # service_access, speed, all, none]
  enabled_checkers:
  - url_probe
  - reachability
  - api_service
  - browser_service
  check_workers: 4
  # Базовый порт mixed-inbound sing-box: каждый батч берёт свой свободный
  port: 7891
  # Путь к sing-box: можно указать папку поставки (бинарник найдётся сам) или
  # файл напрямую
  path: singbox-subscribe/sing-box/sing-box.exe
  # Какие батчи сохранять в logs/singbox: конфиг, вывод sing-box и meta.json.
  # Обычный прогон следов не оставляет — конфиг удаляется, а вывод живёт только
  # в памяти. Когда батч кончается ничем («no_results», 0.1 с, ни одной
  # строки), разбираться не по чему. Идентификатор батча печатается в общем
  # логе рядом с предупреждением, поэтому по нему всегда можно найти детали.
  # [off, error, warning, info]
  keep_failed_batches: error
  # Сколько архивов батчей хранить; старые удаляются. 0 — выключить архивацию
  # целиком
  # (папок)
  keep_failed_batches_limit: 200

# ----------------------------------------------------------------------------
# url_probe  (singbox.checkers)
# ----------------------------------------------------------------------------
  checkers:
    url_probe:
      # URL проверки доступности: лёгкий 204-ответ
      url: https://cp.cloudflare.com/gen_204
      # Сколько серверов уходит в один запуск sing-box
      batch_size: 75
      # Запас времени сверх расчётного дедлайна батча
      # (сек)
      timeout: 20.0
      # Нижняя граница дедлайна батча (время на запуск sing-box)
      # (сек)
      batch_startup: 5.0
      # Сколько раз повторять батч при сбое ЗАПУСКА sing-box
      max_attempts: 2
      # Сколько раз сервер возвращается в очередь, если вердикта не было
      max_retries: 2

# ----------------------------------------------------------------------------
# reachability  (singbox.checkers)
# ----------------------------------------------------------------------------
    reachability:
      # Профилировать, до каких целевых сайтов дотягивается прокси
      enabled: true
      # Файл со списком целей (urls) и правилами разбора их ответов
      urls_file: config/reachability_targets.json
      # Сколько прокси обрабатывать параллельно в одном процессе sing-box
      concurrency: 16
      # Сколько целей ОДНОГО прокси опрашивается одновременно
      per_proxy_concurrency: 6
      # Таймаут одного целевого запроса
      # (сек)
      timeout: 20.0
      # Максимальный TTFB, при котором цель считается достигнутой.
      # Поднят с 500 мс: на живом прогоне метку [Global] не набрал ни один
      # сервер из 13 живых, потому что группа proxy фильтрует именно по ней,
      # и конфиг вообще переставал собираться.
      # (мс)
      max_ping_ms: 3000
      # Сколько байт тела ответа дочитывать для разбора правил
      # (байт)
      body_bytes: 65536
      # Потолок времени на дочитывание тела ответа
      # (сек)
      body_seconds: 8.0
      # С какого stable начинать профилировать (ниже — не трогаем)
      min_stable: 0
      # Тег сервера, набравшего группу merge с этим именем
      global_tag: global

# ----------------------------------------------------------------------------
# api_service  (singbox.checkers)
# ----------------------------------------------------------------------------
    api_service:
      # Проверять сервис HTTP-запросом с ключом (дёшево, без браузера)
      enabled: true
      # С какого stable проверять сервисы
      min_stable: 0
      # Сколько серверов проверять параллельно
      concurrency: 8
      # Тег сервера, у которого сервис открыт
      tag_open: service

# ----------------------------------------------------------------------------
# country  (singbox.checkers)
# ----------------------------------------------------------------------------
    country:
      # Определять страну для серверов без известной страны
      enabled: true
      # Сколько прокси проверять параллельно
      concurrency: 8
      # Таймаут чтения одного geo-запроса (пробуется до 3 эндпоинтов)
      # (сек)
      timeout: 6.0

# ----------------------------------------------------------------------------
# speed  (singbox.checkers)
# ----------------------------------------------------------------------------
    speed:
      # Мерить скорость и проверять доступ к целевому сайту
      enabled: true
      # Сайт для проверки доступа (Gemini режет дата-центровые и VPN-адреса)
      site_url: https://gemini.google.com/
      # Источники замера; пусто = все (cloudflare, ovh, google, microsoft, github)
      sources: []
      # Объём выкачки на КАЖДЫЙ источник
      # (байт)
      probe_bytes: 2097152
      # Объём отдачи (адрес для POST есть только у Cloudflare)
      # (байт)
      upload_bytes: 1048576
      # Сколько источников должно ответить, чтобы замер засчитали
      min_sources: 2
      # Потолок ЧТЕНИЯ, а не размера: медленный сервер отдаёт своё и уходит
      # (сек)
      read_seconds: 4.0
      # Ниже этого — speed-slow
      # (МБ/с)
      min_mbps: 1.0
      # От этого и выше — speed-fast
      # (МБ/с)
      good_mbps: 5.0
      # Сколько серверов мерить параллельно
      concurrency: 8
      # Префикс тегов скорости
      tag_prefix: speed-
      # Тег для каждой категории скорости
      tier_tags:
        fast: speed-fast
        ok: speed-ok
        slow: speed-slow
        blocked: speed-blocked
        geo: speed-geo

# ----------------------------------------------------------------------------
# browser_service  (singbox.checkers)
# ----------------------------------------------------------------------------
    browser_service:
      # Включить браузерную проверку сервиса
      enabled: true
      # Имя сервиса из browser/services.py: задаёт URL, профиль сессии и правила
      # разбора страницы (gemini, claude, chatgpt)
      service: gemini
      # Метка сервера, у которого сервис РАБОТАЕТ (проверено браузером). Имя
      # сервиса и имя метки — разные вещи: сервис остаётся gemini, а метки
      # показывают, КАКИМ транспортом доступ подтверждён: gemini-api — отвечает
      # API (HTTP-проверка с ключом), gemini-chat — открывается сам чат в браузере
      tag: "gemini-chat"
      # Лимит проверок за прогон; 0 = без лимита (доводит список до конца)
      max_checks: 0
      # Пауза между серверами: заходы последовательные, иначе стена трафика
      # (сек)
      pause: 1.0

# ----------------------------------------------------------------------------
# pipeline
# ----------------------------------------------------------------------------
pipeline:
  # Искать новые серверы из подписок (асинхронно, расширяет базу)
  discovery: true
  # Сколько источников подписок качать одновременно на этапе поиска
  discovery_concurrency: 6
  # Сколько источников качать параллельно при сборке merge.txt
  download_concurrency: 6
  # Таймаут чекеров-ДОПОЛНЕНИЙ (страна, достижимость, браузер)
  # (сек)
  enrich_timeout: 180.0
  # Возвращать незавершённые записи очереди в работу при старте
  queue_persist: true
  # Экспортировать whitelist.txt после цикла
  export_lists: true
  # Записывать merge.txt (файл пула проверки) после наполнения очереди
  write_merge: true
  # Папка с ПОЛЬЗОВАТЕЛЬСКИМИ проверяющими алгоритмами
  custom_checkers_dir: singbox-subscribe/pipeline/checkers/custom

# ----------------------------------------------------------------------------
# paths
# ----------------------------------------------------------------------------
paths:
  # Список ссылок на подписки
  urls_file: config/subs/urls.json
  # Файл пула проверки
  merge_file: source/merge.txt
  # Выгрузка живых серверов
  whitelist_file: output/whitelist.txt
  # Чёрный список
  blacklist_file: source/blacklist.txt
  # Центральная база серверов
  servers_db_file: source/servers.db
  # Шаблон конфига sing-box для проверки живости
  urltest_template: singbox-subscribe/config/urltest_template.json
  # Шаблон конфига sing-box для прочих проверок
  countrytest_template: singbox-subscribe/config/countrytest_template.json
  # Папка с шаблонами конфига для деплоя
  config_template_dir: config/templates
  # Куда sing-box пишет временные конфиги батчей
  sing_box_output_dir: singbox-subscribe/.tmp_singbox

# ----------------------------------------------------------------------------
# log
# ----------------------------------------------------------------------------
log:
  # Каталог логов
  dir_path: logs
  # ПОРОГ: что попадает в файлы и консоль
  # [DEBUG, INFO, WARNING, ERROR, CRITICAL, OFF]
  level: INFO
  # Порог КОНСОЛИ (файлы можно подробнее, консоль тише)
  # [DEBUG, INFO, WARNING, ERROR, CRITICAL, OFF]
  console_level: INFO
  # Главный файл (всё, что прошло порог)
  file_name: app.log
  # Размер файла до ротации
  # (байт)
  max_bytes: 10485760
  # Сколько копий хранит ротация
  backup_count: 5
  # Файлы старше этого срока удаляются при старте; 0 = не удалять
  # (дней)
  retention_days: 14
  # Отдельный файл на уровень (debug/info/warning/error)
  per_level_files: true
  # Формат записей
  # [text, json]
  format: text
  # Не больше N одинаковых сообщений за окно, дальше — одна сводка
  throttle_limit: 20
  # Окно защиты от «пулемёта»
  # (сек)
  throttle_window: 60.0
  # Заворачивать print() и сторонние библиотеки в логгер
  capture_stdout: false

# ----------------------------------------------------------------------------
# web
# ----------------------------------------------------------------------------
web:
  # Адрес, на котором слушает API
  host: 0.0.0.0
  # Порт API
  port: 7999

# ----------------------------------------------------------------------------
# deploy
# ----------------------------------------------------------------------------
deploy:
  # Публиковать собранный конфиг после каждого цикла
  enabled: true
  # Локальный деплой: писать собранный конфиг в файл на этой машине (токены не
  # нужны). Включён по умолчанию — собранный конфиг кладётся в output/,
  # GitHub-деплой включается отдельно (repo + токен в .env)
  local: true
  # Папка локального деплоя (в мульти-режиме в неё кладутся файлы по имени
  # шаблона)
  local_path: output
  # Репозиторий owner/repo для GitHub-деплоя (пусто = GitHub-деплой не
  # настроен)
  repo: "LaronDambon/sing-box-config"
  # Шаблон сборки из config/templates (одиночный режим)
  template: sbc-1.14.json
  # Мульти-деплой: имена шаблонов или all (все из config/templates)
  templates: []
  # Путь файла внутри репозитория (в мульти-режиме — только каталог)
  path: config.json
  # Создавать репозиторий автоматически, если его нет
  create_repo: false
  # Источник текущего IP для плейсхолдера: файл или http(s)-ссылка (нужен,
  # только если шаблон содержит плейсхолдер)
  ip_source: ""
  # Имя плейсхолдера в шаблоне, замещаемого актуальным IP
  ip_placeholder: "{{SERVER_IP}}"

# ----------------------------------------------------------------------------
# services
# ----------------------------------------------------------------------------
services:
  # Служба поиска новых серверов
  discovery: true
  # Служба добора серверов из базы
  collector: true
  # Служба проверки
  checker: true
  # Служба переноса вердиктов в таблицу серверов
  results: true
  # Служба обновления списков
  publisher: true
  # Как часто скачивать подписки
  # (сек)
  discovery_interval: 3600.0
  # Как часто добирать серверы из базы в очередь
  # (сек)
  collector_interval: 60.0
  # Как часто переносить вердикты в базу
  # (сек)
  results_interval: 2.0
  # Как часто обновлять whitelist/merge
  # (сек)
  publisher_interval: 1800.0
  # Публиковать (деплоить) списки при выгрузке
  publisher_deploy: false
